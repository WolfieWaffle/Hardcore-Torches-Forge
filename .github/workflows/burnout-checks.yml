name: Burnout checks (1.21.1)

on:
  pull_request:
    branches: ['1.21.1']
  push:
    branches: ['perf/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Standalone core regression tests
        run: bash tools/test-burnout-core.sh
      - name: Adapter control-flow tests (stand-in engine, not Minecraft)
        run: python tools/test-burnout-adapter.py
      - name: Static integration contracts
        run: python tools/check-burnout-contracts.py
      - name: Real NeoForge compilation and build
        run: bash gradlew --no-daemon build
      - name: Preserve build reports and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: burnout-build-results
          if-no-files-found: ignore
          path: |
            build/reports/
            build/libs/
